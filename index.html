<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>社内物品管理システム</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .pin {
      position: absolute;
      transform: translate(-50%, -50%);
      transition: all 0.2s ease;
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen">

  <!-- ヘッダー -->
  <header class="bg-indigo-700 text-white p-4 shadow-md flex justify-between items-center">
    <h1 class="text-xl font-bold">社内物品管理システム</h1>
    <div id="userStatus" class="flex items-center gap-4 text-sm">
      <span id="userNameDisplay">未ログイン</span>
      <button id="logoutBtn" onclick="logout()" class="hidden bg-indigo-900 hover:bg-indigo-800 px-3 py-1 rounded text-xs">ログアウト</button>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="container mx-auto p-4 max-w-5xl">

    <!-- 1. ログイン画面 -->
    <div id="loginSection" class="bg-white p-6 rounded-lg shadow-md max-w-md mx-auto my-12">
      <h2 class="text-lg font-bold mb-4 text-center">ログイン</h2>
      <div class="space-y-4">
        <div>
          <label class="block text-xs text-gray-600 mb-1">ID (ID名)</label>
          <input type="text" id="loginId" class="w-full border p-2 rounded text-sm" placeholder="admin または user">
        </div>
        <div>
          <label class="block text-xs text-gray-600 mb-1">パスワード</label>
          <input type="password" id="loginPw" class="w-full border p-2 rounded text-sm" placeholder="admin123 または user123">
        </div>
        <button onclick="handleLogin()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white p-2 rounded font-bold text-sm">ログイン</button>
      </div>
    </div>

    <!-- 2. アプリ本体（初期状態は非表示） -->
    <div id="appSection" class="hidden space-y-6">

      <!-- タブ切替 -->
      <div class="flex border-b border-gray-300 gap-2">
        <button onclick="switchTab('items')" id="tab-items" class="py-2 px-4 border-b-2 border-indigo-600 font-bold text-indigo-600">物品一覧・検索</button>
        <button onclick="switchTab('map')" id="tab-map" class="py-2 px-4 text-gray-500 font-medium">図面ピン留め確認</button>
        <button onclick="switchTab('report')" id="tab-report" class="py-2 px-4 text-gray-500 font-medium">不足・発注報告</button>
      </div>

      <!-- Tab A: 物品一覧・検索 -->
      <div id="sec-items" class="space-y-4">
        <div class="flex flex-col sm:flex-row gap-2 justify-between items-center bg-white p-4 rounded shadow-sm">
          <input type="text" id="searchInput" oninput="renderItems()" placeholder="物品名・タグ・場所で検索..." class="border p-2 rounded text-sm w-full sm:w-80">
          <button id="adminAddBtn" onclick="openItemModal()" class="hidden bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded text-sm font-bold w-full sm:w-auto">＋ 新規物品追加 (管理者専用)</button>
        </div>

        <div class="bg-white rounded shadow-sm overflow-x-auto">
          <table class="w-full text-left text-sm">
            <thead class="bg-gray-50 text-gray-600 border-b">
              <tr>
                <th class="p-3">物品名</th>
                <th class="p-3">カテゴリ</th>
                <th class="p-3">保管場所</th>
                <th class="p-3">タグ</th>
                <th class="p-3">担当</th>
                <th class="p-3 text-center">操作</th>
              </tr>
            </thead>
            <tbody id="itemsTableBody" class="divide-y">
              <!-- JSで動的描画 -->
            </tbody>
          </table>
        </div>
      </div>

      <!-- Tab B: 図面ピン留め確認 -->
      <div id="sec-map" class="hidden bg-white p-4 rounded shadow-sm space-y-4">
        <p class="text-xs text-gray-500">保管場所を選択すると図面上の位置（ピン）が赤く表示されます。</p>
        <div class="relative w-full border bg-gray-100 rounded overflow-hidden aspect-[16/9] flex items-center justify-center">
          <!-- 背景図面（事務所図面.jpg が同じフォルダにあれば表示されます） -->
          <img src="事務所図面.jpg" alt="事務所図面" class="absolute inset-0 w-full h-full object-contain" onerror="this.style.display='none'">
          
          <div class="absolute inset-0 opacity-20 bg-[radial-gradient(#4f46e5_1px,transparent_1px)] [background-size:16px_16px]"></div>
          <div class="text-gray-400 font-bold text-xl pointer-events-none">オフィスマップ・図面エリア</div>
          
          <!-- ピン描画エリア -->
          <div id="pinLayer" class="absolute inset-0"></div>
        </div>
      </div>

      <!-- Tab C: 不足・発注報告 -->
      <div id="sec-report" class="hidden bg-white p-6 rounded shadow-sm max-w-lg mx-auto space-y-4">
        <h3 class="font-bold border-b pb-2">物品の不足・補充依頼</h3>
        <div class="space-y-3 text-sm">
          <div>
            <label class="block text-xs text-gray-600 mb-1">対象物品</label>
            <select id="reportItemSelect" class="w-full border p-2 rounded"></select>
          </div>
          <div>
            <label class="block text-xs text-gray-600 mb-1">発見者・報告者</label>
            <input type="text" id="reportFinder" class="w-full border p-2 rounded bg-gray-50" readonly>
          </div>
          <div>
            <label class="block text-xs text-gray-600 mb-1">希望数量 / 状態メモ</label>
            <input type="text" id="reportComment" class="w-full border p-2 rounded" placeholder="例: 残り1箱です。補充をお願いします。">
          </div>
          <button onclick="submitReport()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white p-2 rounded font-bold">報告を送信</button>
        </div>
      </div>

    </div>
  </main>

  <script>
    // ==========================================
    // 1. Supabase 初期設定
    // ==========================================
    const SUPABASE_URL = "https://sqgagiwcwynkavrpodzs.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNxZ2FnaXdjd3lua2F2cnBvZHpzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2Njg0NDMsImV4cCI6MjEwNjI0NDQ0M30.Jucqa0vMKLCW8ugoDs6EmcnyhNPnOtU3zdD2Y3pYPEc";

    let supabase = null;
    let currentUser = null;
    let dbItems = [];
    let dbLocations = [];

    // ページの読み込み完了時にSupabaseを初期化
    window.addEventListener('DOMContentLoaded', () => {
      try {
        if (window.supabase) {
          supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }
      } catch (e) {
        console.error("Supabase初期化エラー:", e);
      }
    });

    // ログイン処理
    async function handleLogin() {
      if (!supabase) {
        alert("Supabaseの初期化に失敗しました。ページを再読み込みしてください。");
        return;
      }

      const id = document.getElementById('loginId').value.trim();
      const pw = document.getElementById('loginPw').value.trim();

      const { data, error } = await supabase
        .from('users')
        .select('*')
        .eq('id', id)
        .eq('password', pw)
        .single();

      if (error || !data) {
        alert('IDまたはパスワードが正しくありません');
        return;
      }

      currentUser = data;
      document.getElementById('userNameDisplay').textContent = `${currentUser.name} (${currentUser.role === 'admin' ? '管理者' : '一般'})`;
      document.getElementById('loginSection').classList.add('hidden');
      document.getElementById('appSection').classList.remove('hidden');
      document.getElementById('logoutBtn').classList.remove('hidden');

      if (currentUser.role === 'admin') {
        document.getElementById('adminAddBtn').classList.remove('hidden');
      }

      document.getElementById('reportFinder').value = currentUser.name;

      // 初回データ読み込み
      await loadInitialData();
    }

    function logout() {
      location.reload();
    }

    // データ取得（Supabase）
    async function loadInitialData() {
      const { data: items } = await supabase.from('items').select('*');
      const { data: locations } = await supabase.from('locations').select('*');

      dbItems = items || [];
      dbLocations = locations || [];

      renderItems();
      renderMapPins();
      populateReportSelect();
    }

    // 物品テーブル描画
    function renderItems() {
      const keyword = document.getElementById('searchInput').value.toLowerCase();
      const tbody = document.getElementById('itemsTableBody');
      tbody.innerHTML = '';

      const filtered = dbItems.filter(item => 
        (item.name && item.name.toLowerCase().includes(keyword)) ||
        (item.location_name && item.location_name.toLowerCase().includes(keyword)) ||
        (item.tags && item.tags.some(t => t.toLowerCase().includes(keyword)))
      );

      filtered.forEach(item => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="p-3 font-medium">${item.name || ''}</td>
          <td class="p-3 text-gray-600">${item.category || ''}</td>
          <td class="p-3 text-indigo-600 font-semibold">${item.location_name || ''}</td>
          <td class="p-3">${(item.tags || []).map(t => `<span class="bg-gray-100 text-gray-600 text-xs px-2 py-0.5 rounded mr-1">${t}</span>`).join('')}</td>
          <td class="p-3 text-gray-600">${item.manager || '-'}</td>
          <td class="p-3 text-center">
            <button onclick="focusMap('${item.location_name}')" class="text-xs bg-indigo-50 text-indigo-600 hover:bg-indigo-100 px-2 py-1 rounded">場所確認</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // 図面ピン描画
    function renderMapPins(activeLocationName = null) {
      const layer = document.getElementById('pinLayer');
      layer.innerHTML = '';

      dbLocations.forEach(loc => {
        const pin = document.createElement('div');
        const isActive = loc.name === activeLocationName;
        pin.className = `pin cursor-pointer font-bold text-xs px-2 py-1 rounded shadow ${isActive ? 'bg-red-600 text-white z-10 scale-125' : 'bg-white text-gray-700 border border-gray-300'}`;
        pin.style.left = `${loc.pin_x}%`;
        pin.style.top = `${loc.pin_y}%`;
        pin.textContent = loc.name;
        pin.onclick = () => alert(`保管場所: ${loc.name}`);
        layer.appendChild(pin);
      });
    }

    function focusMap(locationName) {
      switchTab('map');
      renderMapPins(locationName);
    }

    // 不足報告プルダウン
    function populateReportSelect() {
      const select = document.getElementById('reportItemSelect');
      select.innerHTML = dbItems.map(i => `<option value="${i.name}">${i.name} (場所: ${i.location_name})</option>`).join('');
    }

    // 不足報告送信
    async function submitReport() {
      const itemName = document.getElementById('reportItemSelect').value;
      const comment = document.getElementById('reportComment').value;

      if (!comment) {
        alert('コメントを入力してください');
        return;
      }

      const { error } = await supabase.from('history').insert([{
        item_name: itemName,
        finder: currentUser.name,
        requester: currentUser.name,
        comment: comment
      }]);

      if (error) {
        alert('送信に失敗しました');
      } else {
        alert('補充依頼・報告を送信しました！');
        document.getElementById('reportComment').value = '';
      }
    }

    // タブ切替
    function switchTab(tab) {
      ['items', 'map', 'report'].forEach(t => {
        document.getElementById(`sec-${t}`).classList.add('hidden');
        document.getElementById(`tab-${t}`).className = 'py-2 px-4 text-gray-500 font-medium';
      });
      document.getElementById(`sec-${tab}`).classList.remove('hidden');
      document.getElementById(`tab-${tab}`).className = 'py-2 px-4 border-b-2 border-indigo-600 font-bold text-indigo-600';
    }
  </script>
</body>
</html>
